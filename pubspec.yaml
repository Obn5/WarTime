name: warlearn
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  file_picker: ^8.1.6
  google_fonts: ^6.1.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/warprofile.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/sample_quiz.json
    - assets/quiz_webdev.json
    - assets/warprofile.png
